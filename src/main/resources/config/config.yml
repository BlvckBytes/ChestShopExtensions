commands:
  shopSearch:
    name: shopsearch
    aliases:
      - shs
  shopOverview:
    name: shopoverview
    aliases:
      - sho
  shopSearchToggle:
    name: shopsearchtoggle
    aliases:
      - shst
  shopSearchReload:
    name: shopsearchreload
    aliases:
      - shsrl
  shopItemInfo:
    name: shopiteminfo
    aliases:
      - sii

regionFilter:
  shopRegionPattern: '^(shop[0-9]+)|adminshop|zoospawn$'
  shopRegionWorlds:
    - world

sellGui:
  inventoryTitle: '<&8>Adminshop-Verkauf'
  inventoryRowCount: 4
  noPermission: '{lut.shop_prefix} <&c>Du hast keinen Zugriff auf diese Funktion!'
  openingPrompt: '{lut.shop_prefix} <&f>Lege Items in das Inventar und schließe es, um sie an den Adminshop zu verkaufen.'
  emptyInventory: '{lut.shop_prefix} <&c>Das Verkaufsinventar war leer - breche ab!'
  soldItems: |
    {lut.shop_prefix} <&f>Du hast<space/>
    <container *for-item="items" *for-separator={,<space/>}>
      <&b>{item.count}x <translate [item.key] /> <&f>für <&e>{item.value}
    </container> an den Adminshop verkauft.
  unsellableItems: |
    {lut.shop_prefix} <&c>Die folgenden Items konnten nicht verkauft werden:<space/>
    <container *for-item="items" *for-separator={,<space/>}>
      <&4>{item.count}x <translate [item.key] />
    </container>.
  unallowedWorld: '{lut.shop_prefix} <&c>Dieses Feature steht nur in der Bauwelt zur Verfügung!'
  unallowedRegion: '{lut.shop_prefix} <&c>Dieses Feature steht nur innerhalb des Adminshops zur Verfügung!'
  regionFilter:
    shopRegionPattern: '^adminshop$'
    shopRegionWorlds:
      - world
  invSell:
    filtersInventoryTitle: '<&8>Inventarverkaufsfilter'
    noPermission: '{lut.shop_prefix} <&c>Du hast keinen Zugriff auf diese Funktion!'
    commandUsage: '{lut.shop_prefix} <&c>Nutze: /{label} \<<&4 *for-action="actions" *for-separator={,<space/>}>{action}</>>'
    openingFiltersInventory: '{lut.shop_prefix} <&f>Bearbeite nun die Inventarverkaufsfilter in dem du Items, die du zukünftig per Klick verkaufen können möchtest, ins Menü legst; schließe, um zu speichern.'
    savedFiltersInventory: '{lut.shop_prefix} <&f>Es wurden <&a>{filter_count} Inventarverkaufsfilter <&f>gespeichert.'
    noFiltersConfigured: '{lut.shop_prefix} <&c>Es wurden noch keine Inventarverkaufsfilter konfiguriert. Stelle Filter mit <&4>{edit_command} <&c>ein.'
    noMatchingItemsFound: '{lut.shop_prefix} <&c>Dein Inventar beinhaltet keine übereinstimmenden Items, die verkauft werden könnten. Stelle Filter mit <&4>{edit_command} <&c>ein.'
    filtersReturnedShulkerBoxes: '{lut.shop_prefix} <&c>Das Filtermenü unterstützt keine <&4>Shulkerboxen<&c>; retourniere <&4>{count} Items<&c>!'
    filtersOtherMissingPermission: '{lut.shop_prefix} <&c>Du hast keinen Zugriff darauf, die Filter anderer einzusehen!'
    filtersOtherUnknownName: '{lut.shop_prefix} <&c>Der Spielername <&4>{name} <&c>ist dem Server nicht bekannt!'
    filtersOtherCurrentlyViewed: '{lut.shop_prefix} <&c>Das Filtermenü von <&4>{target_name} wird gerade bereits von <&4>{viewer_name} <&c>eingesehen!'
    filtersOtherNowViewing: '{lut.shop_prefix} <&f>Du siehst nun das Filtermenü von <&a>{target_name} <&f>ein.'
    filtersOtherTargetWentOffline: '{lut.shop_prefix} <&c>Der Besitzer <&4>{target_name} <&c>des aktuell geöffneten Filtermenüs hat den Server verlassen - schließe!'
    filtersOtherReadOnly: '{lut.shop_prefix} <&c>Das Filtermenü von <&4>{target_name} <&c>kann nicht bearbeitet werden, da der Spieler offline ist!'

transactionUndo:
  undoWindowSeconds: 10
  undoMessage: '{lut.shop_prefix} <&f><i>Die letzte Transaktion des Shops wurde rückgängig gemacht.'

shopItemInfo:
  previewTitle: '<&8>Shop-Vorschau ({x}, {y}, {z})'

playerMessages:
  searchCommandInvalidSearch: '{lut.search_prefix} <&c>Ungültige Suche: {error}'
  searchCommandNoResults: '{lut.search_prefix} <&c>Die Suche <&4>{query} <&c>erzielte <&4>keine Ergebnisse<&c>!'
  searchCommandResponse: '{lut.search_prefix} <&7>Die Suche <&a>{query} <&7>erzielte <&a>{result_count} Ergebnisse<&7>!'
  searchCommandBlankUi: '{lut.search_prefix} <&6>Achtung! <&7>Es werden <&6>keine der insgesamt {result_count} Einträge <&7>angezeigt, da alle Ergebnisse von deinen <&6>aktuellen Filtern <&7>ausgeschlossen werden!'
  shopTeleportShopGone: '{lut.search_prefix} <&c>Der Shop bei den Koordinaten <&4>{coordinates} <&c>in der Welt <&4>{world} <&c>existiert nicht mehr; entferne!'
  shopTeleportTeleported: '{lut.search_prefix} <&7>Du wurdest zum Shop von <&a>{owner} <&7>bei <&a>{coordinates} <&7>teleportiert!'
  shopSearchToggleNotInARegion: '{lut.search_prefix} <&c>Du befindest dich aktuell in keiner Shop-Region, die du besitzt!'
  shopSearchToggleNowVisible: '{lut.search_prefix} <&7>Die Sichtbarkeit der Region <&a>{region} <&7>von <&a>{owner} <&7>ist nun <&a>aktiviert<&7>!'
  shopSearchToggleNowInvisible: '{lut.search_prefix} <&7>Die Sichtbarkeit der Region <&a>{region} <&7>von <&a>{owner} <&7>ist nun <&c>deaktiviert<&7>!'
  pluginReloadedSuccess: '{lut.prefix} <&7>Das Plugin wurde erfolgreich <&a>neu geladen<&7>.'
  pluginReloadedError: '{lut.prefix} <&c>Ein Fehler trat während des Ladeprozesses auf. Überprüfe die Konsole!'
  notLookingAtShopSign: '{lut.shop_prefix} <&c>Du siehst aktuell kein Shop-Schild an!'
  multipleSignsToChooseFrom: '{lut.shop_prefix} <&c>An diesem Block sind mehrere verschiedene Shop-Schilder befestigt; bitte wähle ein bestimmtes durch genaues ansehen aus!'
  buySellNoPermission: '{lut.shop_prefix} <&c>Dir fehlen die Zugriffsrechte zu diesem Befehl!'
  buySellUsage: '{lut.shop_prefix} <&c>Benutze: /{label} \<<&4>Anzahl<&c>>'
  buySellMalformedAmount: '{lut.shop_prefix} <&c>Keine valide Ganzzahl oder Ausdruck: <&4>{amount}<&c>!'
  buySellAmountInvalid: '{lut.shop_prefix} <&c>Die Anzahl muss größer als Null sein: <&4>{amount}<&c>!'

resultDisplay:
  title: |
    <container *if="has(owner)">
      <&8>{owner}'s Shops <&e>{current_page}<&8>/<&e>{number_of_pages}
    </container>
    <container *else>
      <&8>Shopsuche <&e>{current_page}<&8>/<&e>{number_of_pages}
    </container>
  rows: 6
  paginationSlots: '0..44'
  items:
    previousPage:
      slots: 'last_slot - 8'
      type: PLAYER_HEAD
      textures: '{lut.textures[current_page > 1 then "arrow_left" else "arrow_left_red"]}'
      name: |
        <reset>
          <container *if="current_page > 1">
            <&8>» <&6>Vorherige Seite <&8>«
          </container>
          <container *else>
            <&8>» <&c>Keine vorherige Seite <&8>«
          </container>
      lore: |
        <reset>
          <br/>
          {lut.spacer}<br/>
          <&8>➥ <&e>Linksklick <&7>Navigiere zur vorherigen Seite<br/>
          <&8>➥ <&e>Rechtsklick <&7>Springe zur ersten Seite<br/>
          {lut.spacer}
    nextPage:
      slots: 'last_slot'
      type: PLAYER_HEAD
      textures: '{lut.textures[current_page < number_of_pages then "arrow_right" else "arrow_right_red"]}'
      name: |
        <reset>
          <container *if="current_page < number_of_pages">
            <&8>» <&6>Nächste Seite <&8>«
          </container>
          <container *else>
            <&8>» <&c>Keine nächste Seite <&8>«
          </container>
      lore: |
        <reset>
          <br/>
          {lut.spacer}<br/>
          <&8>➥ <&e>Linksklick <&7>Navigiere zur nächsten Seite<br/>
          <&8>➥ <&e>Rechtsklick <&7>Springe zur letzten Seite<br/>
          {lut.spacer}
    representativePatch:
      lore: |
        <reset>
          <br/>
          {lut.spacer}<br/>
          <&8>♦ <&7>Besitzer: <&e>{owner}<br/>
          <&8>♦ <&7>Einheit: <&e>{quantity}x<br/>
          <container *if="can_buy">
            <&8>♦ <&7>Verkaufspreis: <&e>{buy_price}<br/>
            <&8>♦ <&7>Lagerbestand: <&e>{remaining_stock >= 0 then remaining_stock else "∞"}<br/>
          </container>
          <container *if="can_sell">
            <&8>♦ <&7>Ankaufspreis: <&e>{sell_price}<br/>
            <&8>♦ <&7>Platz: <&e>{remaining_space >= 0 then remaining_space else "∞"}<br/>
          </container>
          <&8>♦ <&7>Position: <&e>{loc_x} {loc_y} {loc_z} <&7>(<&e>{loc_world}<&7>)<br/>
          {lut.spacer}
    shopOwner:
      type: PLAYER_HEAD
      textures: '{textures}'
      name: |
        <reset>
          <&8>» <&6>{owner} <&8>«
      lore: |
        <reset>
          <br/>
          {lut.spacer}<br/>
          <&8>➥ <&e>Linksklick <&7>Angebote anzeigen<br/>
          {lut.spacer}
    backButton:
      slots: 'last_slot - 4'
      type: PLAYER_HEAD
      textures: '{lut.textures.back}'
      name: |
        <reset>
          <&8>» <&6>Zurück <&8>«
      lore: |
        <reset>
          <br/>
          {lut.spacer}<br/>
          <&8>➥ <&e>Linksklick <&7>Gelange zur Übersicht<br/>
          {lut.spacer}
    sorting:
      slots: 'last_slot - 6'
      type: COMPARATOR
      name: |
        <reset>
          <&8>» <&6>Sortierung <&8>«
      lore: |
        <reset>
          <br/>
          {lut.spacer}<br/>
          <container
            *for-sorting="sorting_selections"
            *for-separator={<br/>}
            *let-criterion="lut.sorting_criteria[sorting.criterion] ?? sorting.criterion"
            *let-renderer="lut.sorting_selection[sorting.selection] ?? sorting.selection"
          >
            <&8><&e *use="sorting.active">➥ <container [renderer] />
          </container>
          <br/>
          {lut.spacer}<br/>
          <&8>➥ <&e>Werfen <&7>Kriterium auswählen<br/>
          <&8>➥ <&e>Linksklick <&7>Sortierrichtung ändern<br/>
          <&8>➥ <&e>Alle werfen <&7>Nach unten verschieben<br/>
          <&8>➥ <&e>Rechtsklick <&7>Auswahlen zurücksetzen<br/>
          {lut.spacer}
    filtering:
      slots: 'last_slot - 2'
      type: HOPPER
      name: |
        <reset>
          <&8>» <&6>Filtern <&8>«
      lore: |
        <reset>
          <br/>
          {lut.spacer}<br/>
          <container
            *for-filtering="filtering_selections"
            *for-separator={<br/>}
            *let-criterion="lut.filtering_criteria[filtering.criterion] ?? filtering.criterion"
            *let-renderer="lut.filtering_selection[filtering.selection] ?? filtering.selection"
          >
            <&8><&e *use="filtering.active">➥ <container [renderer] />
          </container>
          <br/>
          {lut.spacer}<br/>
          <&8>➥ <&e>Werfen <&7>Kriterium auswählen<br/>
          <&8>➥ <&e>Linksklick <&7>Zustand umschalten<br/>
          <&8>➥ <&e>Rechtsklick <&7>Auswahlen zurücksetzen<br/>
          {lut.spacer}
    filler:
      slots: '(last_slot - 8)..last_slot'
      type: BLACK_STAINED_GLASS_PANE
      name: " "

transactionLog:
  mainCommand:
    name: 'csn'
  historyShortcutCommand:
    name: 'shopverlauf'
    aliases:
      - svl
  maxAgeDays: 90
  historyPageSize: 10
  joinNotifyDelayTicks: 25
  transactionMergeMaxDeltaSeconds: '60 * 5'
  playersOnly: '{lut.shop_prefix} <&c>Dieser Befehl ist nur Spielern zugänglich!'
  helpScreen: |
    <&8><&m>{" " ** 25}</> <&6>Shop-Historie <&8><&m>{" " ** 25}</><br/>
    <&7>- /{label} [<&d>help</>] - Zeigt diese Übersicht an.<br/>
    <&7>- /{label} <&d>history</> <&5>[Seite]</> oder <&d>/shopverlauf</> <&5>[Seite]</> oder <&d>/svl</> <&5>[Seite]</> - Zeigt die verfügbare Historie an.<br/>
    <&7>- /{label} <&d>clear</> - Leert die Historie.<br/>
    <&7>- /{label} <&d>teleport</> <&5>\<Transaktionsnummer></> - Teleportiert zum Shop-Schild einer Transaktion (wird durch klicken auf eine Zeile in der Historie automatisch ausgeführt).<br/>
  invalidPageNumber: '{lut.shop_prefix} <&c>Ungültige Seite <&4>{input}</>; bitte eine positive Ganzzahl angeben!'
  invalidTransactionNumber: '{lut.shop_prefix} <&c>Ungültige Transaktionsnummer <&4>{input}</>; bitte eine positive Ganzzahl angeben!'
  outOfBoundsPageNumber: '{lut.shop_prefix} <&c>Die Seitenzahl <&4>{current_page}</> ist größer als die Gesamtanzahl aller Seiten von <&4>{page_count}</>!'
  noHistoryToClear: '{lut.shop_prefix} <&c>Es befinden sich aktuell keine Einträge in deiner Historie, die gelöscht werden könnten!'
  noHistoryToShow: '{lut.shop_prefix} <&c>Deine Historie besitzt aktuell keine Einträge!'
  historyCleared: |
    {lut.shop_prefix} <&f>Deine Historie wurde geleert (
      <container *if="count eq 1">
        <&a>ein</> gelöschter Eintrag
      </container>
      <container *else>
        <&a>{count}</> gelöschte Einträge
      </container>
    ).
  historyPageScreen: |
    <&8><&m>{" " ** 25}</> <&6>Shop-Historie <&8><&m>{" " ** 25}</><br/>
    <&7>Seite {current_page}/{page_count} - /{history_command} [Seite]<br/>
    <br/>
    <container
      *for-transaction="transactions"
      *for-separator={<br/>}
      *let-transaction_number="transaction.index + 1"
    >
      <hover-text value={<&a>Klicke, um dich zum Shop-Schild zu teleportieren!}>
        <run-command value=`/{teleport_command} {transaction_number}`>
          <&7>(#{transaction_number}) <&9>{transaction.client}</>
          <space/>
          <container *if="transaction.was_buy">kaufte</>
          <container *else>verkaufte</>
          <space/>
          <hover-stack [transaction.item]>
            <&a>{transaction.amount}x</> <&9><translate [transaction.item_key] /></>
          </hover-stack>
          <space/>
          vor
          <space/>
          <&f><duration
            *let-show_seconds="transaction.age <= 1000 * 60"
            [transaction.age]
            [units]="show_seconds then 's' else 'hmd'"
            [zeroes]="show_seconds then 's'"
          /></>
          <space/>
          <container *let-price={$<number [transaction.price] format="0.##" locale="de_DE" />}>
            <&a *if="transaction.was_buy">(+{price})</>
            <&c *else>(-{price})</>
          </>
          <container *if="transaction.did_exhaust">
            <space/><&7>(<&4>⚠ <&c>Der Shop ist nun {transaction.was_buy then "leer" else "voll"}! <&4>⚠<&7>)
          </container>
    </container>
    <br/>
  joinNotification: |
    {lut.shop_prefix} <&e>Es<space/>
    <container *if="count eq 1">
      befindet sich <&6>ein Eintrag</>
    </container>
    <container *else>
      befinden sich <&6>{count} Einträge</>
    </container>
    <space/>in deiner Historie! Nutze <&6>/csn history</> oder <&6>/svl</>, um die Liste einzusehen und <&6>/csn clear</>, um sie zu leeren.
  teleportHasNoTransactions: '{lut.shop_prefix} <&c>Deine Transaktionshistorie besitzt aktuell keine Einträge, zu denen du dich teleportieren könntest!'
  teleportNumberNotFound: '{lut.shop_prefix} <&c>Die Transaktionsnummer <&4>{transaction_number}</> ist größer als deine Gesamtanzahl aller Transaktionen von <&4>{transactions_count}</>!'
  teleportFailedNoSign: '{lut.shop_prefix} <&c>Das Schild der Transaktion <&4>#{transaction.index + 1}</> existiert nicht mehr; breche die Teleportation ab!'
  teleportSuccess: '{lut.shop_prefix} <&f>Du wurdest zum Ort der Transaktion <&a>#{transaction.index + 1}</> teleportiert.'

